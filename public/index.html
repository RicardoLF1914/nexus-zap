<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusZap</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/crm.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/composer.css" />
  <link rel="stylesheet" href="css/toast.css" />
  <style>
    .app-shell {
      display: grid;
      grid-template-columns: var(--col-list-width) 1fr var(--col-crm-width);
      height: 100vh;
    }

    .list-column {
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .list-column__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
  </style>
</head>
<div id="toast-container" class="toast-container"></div>
<body>
  <div class="app-shell">
    <aside class="list-column">
      <div class="list-column__header">
        <span id="wago-status-badge" class="status-badge status-badge--disconnected">Desconectado</span>
        <button id="open-wago-modal">Conectar WhatsApp</button>
      </div>
      <div id="contact-list" class="contact-list"></div>
    </aside>
    <main class="chat-column">
      <header class="chat-column__header">
        <div id="chat-header-info" class="chat-column__header-info">Selecione um contato</div>
      </header>
      <div id="chat-messages" class="chat-column__messages"></div>
      <footer class="chat-column__composer">
        <div id="composer-preview" class="composer__preview">
          <img id="composer-preview-thumb" class="composer__preview-thumb" alt="Preview" />
          <span id="composer-preview-name"></span>
          <button id="composer-preview-remove" class="composer__preview-remove">Remover</button>
        </div>
        <div id="composer-audio-preview" class="composer__audio-preview">
          <audio id="composer-audio-player" controls></audio>
          <button id="composer-audio-remove" class="composer__preview-remove">Remover</button>
        </div>
        <div class="composer">
          <input id="composer-telefone" class="composer__telefone-input" type="text" placeholder="Telefone destino" />
          <button id="composer-attach-btn" class="composer__attach-btn">📎</button>
          <input id="composer-file-input" type="file" style="display: none" accept="image/*,application/pdf" />
          <button id="composer-mic-btn" class="composer__mic-btn">🎤</button>
          <button id="composer-location-btn" class="composer__location-btn">📍</button>
          <button id="composer-contact-btn" class="composer__contact-btn">👤</button>
          <input id="composer-text-input" class="composer__text-input" type="text" placeholder="Digite uma mensagem" />
          <button id="composer-send-btn" class="composer__send-btn">➤</button>
        </div>
      </footer>
    </main>
    <aside class="crm-column">
      <header class="crm-column__header">Detalhes do Contato</header>
      <div class="crm-column__body">
        <div class="crm-perfil">
          <div class="crm-perfil__label">Nome</div>
          <input id="crm-nome-input" class="crm-perfil__nome-input" type="text" placeholder="Sem nome" />
          <div id="crm-telefone-display" class="crm-perfil__telefone"></div>
        </div>

        <div class="crm-funil">
          <div class="crm-perfil__label">Etapa do Funil</div>
          <select id="crm-etapa-select" class="crm-funil__select"></select>
        </div>

        <div class="crm-tags">
          <div class="crm-perfil__label">Etiquetas</div>
          <div id="crm-tags-lista" class="crm-tags__lista"></div>
          <div id="crm-tags-disponiveis" class="crm-tags__disponiveis"></div>
          <div class="crm-tags__criar">
            <input id="crm-nova-tag-nome" class="crm-tags__criar-input" type="text" placeholder="Nova etiqueta" />
            <input id="crm-nova-tag-cor" class="crm-tags__criar-cor" type="color" value="#8B5CF6" />
            <button id="crm-nova-tag-btn" class="crm-tags__criar-btn">+</button>
          </div>

          <div class="crm-notas">
            <div class="crm-perfil__label">Anotações Internas</div>
            <div id="crm-notas-lista" class="crm-notas__lista"></div>
            <div class="crm-notas__form">
              <textarea id="crm-nota-texto" class="crm-notas__textarea" placeholder="Adicionar anotação..."></textarea>
              <button id="crm-nota-btn" class="crm-notas__btn">Salvar</button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div id="wago-modal" class="modal">
    <div class="modal__content">
      <p class="modal__title">Escaneie o QR Code com o WhatsApp</p>
      <img id="wago-qr-image" class="modal__qr" alt="QR Code de conexão" />
      <button id="close-wago-modal" class="modal__close">Fechar</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
